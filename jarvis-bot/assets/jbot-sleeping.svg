<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
  <defs>
    <linearGradient id="gShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d445c"/>
      <stop offset="45%" stop-color="#1b2a3a"/>
      <stop offset="100%" stop-color="#0f1922"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31506c"/>
      <stop offset="100%" stop-color="#172838"/>
    </linearGradient>
    <linearGradient id="gVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10212d"/>
      <stop offset="100%" stop-color="#040b12"/>
    </linearGradient>
    <radialGradient id="gEye" cx="0.5" cy="0.42" r="0.68">
      <stop offset="0%" stop-color="#f2feff"/>
      <stop offset="38%" stop-color="#86f2ff"/>
      <stop offset="100%" stop-color="#16b4d8"/>
    </radialGradient>
    <radialGradient id="gCore" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#d8fcff"/>
      <stop offset="40%" stop-color="#3fe4ff"/>
      <stop offset="100%" stop-color="#0a6f8a"/>
    </radialGradient>
    <radialGradient id="gShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gShellDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22354a"/>
      <stop offset="100%" stop-color="#0c141c"/>
    </linearGradient>
    <linearGradient id="gPanelDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25405a"/>
      <stop offset="100%" stop-color="#121f2c"/>
    </linearGradient>
  </defs>
  <style>
    .shell   { fill:url(#gShellDim); stroke:#070d13; stroke-width:0.35; }
    .panel   { fill:url(#gPanelDim); stroke:#070d13; stroke-width:0.3; }
    .core    { fill:#0891b2; stroke:#124a56; stroke-width:0.4; opacity:0.4; }

    @keyframes jbSnore { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-0.25px); } }
    #body-sleep { animation: jbSnore 3.6s ease-in-out infinite; }

    @keyframes jbZFloat { 0% { transform: translate(0,0); opacity:0; } 20% { opacity:1; } 100% { transform: translate(3px,-6px); opacity:0; } }
    .zzz { animation: jbZFloat 2.6s ease-in infinite; font-family: sans-serif; font-weight:bold; fill:#35e6ff; }
    .zzz.z2 { animation-delay: 0.9s; }
    .zzz.z3 { animation-delay: 1.8s; }
  </style>

  <ellipse cx="8" cy="14.5" rx="8" ry="1.6" fill="url(#gShadow)"/>

  <g id="body-sleep">
    <rect x="1" y="3" width="14" height="9.5" rx="3" class="shell"/>
    <rect x="1.3" y="4.5" width="10.5" height="5.5" rx="2" class="panel"/>
    <line x1="3.5" y1="7.2" x2="6" y2="7.2" stroke="#35e6ff" stroke-width="0.5" stroke-linecap="round"/>
    <line x1="7" y1="7.2" x2="8" y2="7.2" stroke="#35e6ff" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="1.4" class="core"/>
    <line x1="0.2" y1="-0.6" x2="1.6" y2="-1.4" stroke="#0a141c" stroke-width="0.4"/>
    <circle cx="1.6" cy="-1.6" r="0.6" fill="#284453"/>
  </g>

  <text class="zzz z1" x="12" y="0" font-size="2.6">z</text>
  <text class="zzz z2" x="13.5" y="-1.5" font-size="2">z</text>
  <text class="zzz z3" x="15" y="-3" font-size="1.5">z</text>
</svg>
